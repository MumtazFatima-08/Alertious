<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><rect width="1400" height="800" fill="#050505"/><rect width="250" height="800" fill="#080808" stroke="#242424"/><text x="30" y="50" fill="#00d9ff" font-family="Arial" font-size="22" font-weight="700">✦ alertious</text><text x="30" y="70" fill="#777" font-family="Arial" font-size="11">from alerts to incidents.</text><line x1="0" y1="90" x2="250" y2="90" stroke="#242424"/><text x="35" y="135" fill="#fff" font-family="Arial" font-size="14">Overview</text><text x="35" y="180" fill="#fff" font-family="Arial" font-size="14">Incidents</text><text x="35" y="225" fill="#fff" font-family="Arial" font-size="14">Events</text><text x="35" y="270" fill="#fff" font-family="Arial" font-size="14">Investigate</text><text x="35" y="315" fill="#00d9ff" font-family="Arial" font-size="14">Rules</text><text x="35" y="360" fill="#fff" font-family="Arial" font-size="14">Simulator</text><text x="280" y="58" fill="#00d9ff" font-family="Arial" font-size="13" font-weight="700">Security operations</text><text x="280" y="90" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Rules</text><text x="280" y="118" fill="#777" font-family="Arial" font-size="14">Each rule contributes weighted points toward the correlation score.</text><line x1="250" y1="145" x2="1400" y2="145" stroke="#242424"/><text x="280" y="175" fill="#777" font-family="Arial" font-size="13">Entity correlation</text><rect x="280" y="193" width="1080" height="60" fill="#090909" stroke="#252525"/><text x="300" y="218" fill="#fff" font-family="Arial" font-size="14">Same User</text><text x="300" y="238" fill="#777" font-family="Arial" font-size="11">Events involving the same user account are candidates for correlation.</text><text x="1180" y="218" fill="#777" font-family="Arial" font-size="11">Weight 15</text><rect x="1280" y="210" width="45" height="23" rx="12" fill="#002a30" stroke="#00d9ff"/><circle cx="1315" cy="222" r="7" fill="#00d9ff"/><rect x="280" y="261" width="1080" height="60" fill="#090909" stroke="#252525"/><text x="300" y="286" fill="#fff" font-family="Arial" font-size="14">Same IP</text><text x="300" y="306" fill="#777" font-family="Arial" font-size="11">Events originating from the same source IP are candidates for correlation.</text><text x="1180" y="286" fill="#777" font-family="Arial" font-size="11">Weight 15</text><rect x="1280" y="278" width="45" height="23" rx="12" fill="#002a30" stroke="#00d9ff"/><circle cx="1315" cy="290" r="7" fill="#00d9ff"/><rect x="280" y="329" width="1080" height="60" fill="#090909" stroke="#252525"/><text x="300" y="354" fill="#fff" font-family="Arial" font-size="14">Same Device</text><text x="300" y="374" fill="#777" font-family="Arial" font-size="11">Events involving the same device are candidates for correlation.</text><text x="1180" y="354" fill="#777" font-family="Arial" font-size="11">Weight 12</text><rect x="1280" y="346" width="45" height="23" rx="12" fill="#002a30" stroke="#00d9ff"/><circle cx="1315" cy="358" r="7" fill="#00d9ff"/><text x="280" y="420" fill="#777" font-family="Arial" font-size="13">Temporal correlation</text><rect x="280" y="438" width="1080" height="60" fill="#090909" stroke="#252525"/><text x="300" y="463" fill="#fff" font-family="Arial" font-size="14">Time Window</text><text x="300" y="483" fill="#777" font-family="Arial" font-size="11">Events sharing an entity within a 7-minute window strengthen confidence.</text><text x="1180" y="463" fill="#777" font-family="Arial" font-size="11">Weight 10</text><rect x="1280" y="455" width="45" height="23" rx="12" fill="#002a30" stroke="#00d9ff"/><circle cx="1315" cy="467" r="7" fill="#00d9ff"/><text x="280" y="530" fill="#777" font-family="Arial" font-size="13">Sequence correlation</text><rect x="280" y="548" width="1080" height="60" fill="#090909" stroke="#252525"/><text x="300" y="573" fill="#fff" font-family="Arial" font-size="14">Suspicious Sequence</text><text x="300" y="593" fill="#777" font-family="Arial" font-size="11">A known escalation pattern between two events.</text><text x="1180" y="573" fill="#777" font-family="Arial" font-size="11">Weight 15</text><rect x="1280" y="565" width="45" height="23" rx="12" fill="#002a30" stroke="#00d9ff"/><circle cx="1315" cy="577" r="7" fill="#00d9ff"/></svg>